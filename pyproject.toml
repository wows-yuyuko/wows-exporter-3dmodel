[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wows-exporter-3dmodel"
version = "0.1.0"
description = "World of Warships / Korabli ship model exporter (GLB + zstd)"
readme = "README.md"
license = { file = "LICENSE.Apache-2.0" }
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["app*", "models*", "services*", "utils*", "data_extractor*", "uncode_assets*"]
