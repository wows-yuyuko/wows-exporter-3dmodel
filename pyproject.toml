[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wows-exporter-3dmodel"
version = "0.1.0"
description = "World of Warships / Korabli ship model exporter (GLB + zstd)"
readme = "README.md"
# 分离授权：主体 Apache-2.0，data_extractor/kraken.py 为 GPLv3。
# 指向声明文件而不是 LICENSE.Apache-2.0，避免把整个包说成纯 Apache-2.0。
license = { file = "LICENSE" }
requires-python = ">=3.10"

[tool.setuptools.packages.find]
include = ["app*", "models*", "services*", "utils*", "data_extractor*", "uncode_assets*"]
